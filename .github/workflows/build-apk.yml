name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ 'main' ]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.distribution }}-${{ matrix.device }}-${{ matrix.abi }}
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: arm64
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: armeabi
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: x86
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: x86_64
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: universal
          - device: tv
            distribution: gms
            distributionName: Gms
            deviceName: Tv
            abi: universal
          - device: mobile
            distribution: foss
            distributionName: Foss
            deviceName: Mobile
            abi: universal

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve variant names
        id: variant
        shell: bash
        run: |
          set -euo pipefail
          DISTRIBUTION="${{ matrix.distribution }}"
          DISTRIBUTION_CAP="${{ matrix.distributionName }}"
          DEVICE="${{ matrix.device }}"
          ABI="${{ matrix.abi }}"
          DEVICE_CAP="${{ matrix.deviceName }}"
          ABI_CAP="$(tr '[:lower:]' '[:upper:]' <<< "${ABI:0:1}")${ABI:1}"
          echo "distribution=$DISTRIBUTION" >> "$GITHUB_OUTPUT"
          echo "distribution_cap=$DISTRIBUTION_CAP" >> "$GITHUB_OUTPUT"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "abi=$ABI" >> "$GITHUB_OUTPUT"
          echo "device_cap=$DEVICE_CAP" >> "$GITHUB_OUTPUT"
          echo "abi_cap=$ABI_CAP" >> "$GITHUB_OUTPUT"
          echo "gradle_task=assemble${DISTRIBUTION_CAP}${DEVICE_CAP}${ABI_CAP}Release" >> "$GITHUB_OUTPUT"
          echo "apk_name=app-${DISTRIBUTION}-${DEVICE}-${ABI}-release.apk" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        shell: bash
        run: ./gradlew "${{ steps.variant.outputs.gradle_task }}"

      - name: Resolve release output directory
        id: release_dir
        shell: bash
        run: |
          set -euo pipefail
          DISTRIBUTION="${{ steps.variant.outputs.distribution }}"
          DEVICE="${{ steps.variant.outputs.device }}"
          ABI="${{ steps.variant.outputs.abi }}"
          DEVICE_CAP="${{ steps.variant.outputs.device_cap }}"
          ABI_CAP="${{ steps.variant.outputs.abi_cap }}"
          CANDIDATES=(
            "app/build/outputs/apk/${DISTRIBUTION}${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/${DISTRIBUTION}${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/${DISTRIBUTION}/${DEVICE}/${ABI}/release"
            "app/build/outputs/apk/${DISTRIBUTION}/${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/${DISTRIBUTION}/${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/gms${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/gms${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/gms/${DEVICE}/${ABI}/release"
            "app/build/outputs/apk/gms/${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/gms/${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/${DEVICE}/${ABI}/release"
            "app/build/outputs/apk/${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/${ABI}/${DEVICE}/release"
          )
          for d in "${CANDIDATES[@]}"; do
            if [ -d "$d" ]; then
              echo "release_dir=$d" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          FOUND_METADATA="$(
            find app/build/outputs/apk -type f -name "output-metadata.json" \
              \( \
                -path "*/${DISTRIBUTION}/${DEVICE}/${ABI}/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}${DEVICE}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}${DEVICE_CAP}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}/${DEVICE}/${ABI}/*/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}${DEVICE}${ABI_CAP}/*/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}/${DEVICE_CAP}${ABI_CAP}/*/release/output-metadata.json" -o \
                -path "*/${DEVICE}/${ABI}/release/output-metadata.json" -o \
                -path "*/${DEVICE}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${DEVICE_CAP}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${ABI}/${DEVICE}/release/output-metadata.json" \
              \) \
              | head -n 1 || true
          )"
          if [ -n "${FOUND_METADATA:-}" ]; then
            echo "release_dir=$(dirname "$FOUND_METADATA")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Could not resolve APK release output directory for DISTRIBUTION=$DISTRIBUTION DEVICE=$DEVICE ABI=$ABI"
          find app/build/outputs/apk -maxdepth 8 -type d -print || true
          exit 1

      - name: Sign APK
        shell: bash
        env:
          RELEASE_DIR: ${{ steps.release_dir.outputs.release_dir }}
          BUILD_TOOLS_VERSION: 35.0.0
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS_INPUT: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS_VERSION}"
          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT

          for name in KEYSTORE_B64 KEY_ALIAS STORE_PASS; do
            if [ -z "${!name}" ]; then
              echo "::error::Signing secret for $name is empty"
              exit 1
            fi
          done

          if ! printf '%s' "$KEYSTORE_B64" | sed '/^-----/d' | tr -d '[:space:]' | base64 -d > "$KEYSTORE_FILE" 2>/dev/null \
            || [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::KEYSTORE secret is not valid base64. Encode the keystore file as a single base64 string (e.g. 'base64 -w 0 release.keystore')."
            exit 1
          fi

          if ! LIST_OUTPUT="$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass:env STORE_PASS 2>&1)"; then
            echo "::error::keytool could not open the keystore. Either KEYSTORE is not a keystore file or KEYSTORE_PASSWORD is wrong."
            printf '%s\n' "$LIST_OUTPUT" | grep -iE 'exception|error' | head -n 5 || true
            exit 1
          fi

          STORE_TYPE="$(printf '%s\n' "$LIST_OUTPUT" | sed -n 's/^Keystore type: *//p' | head -n 1)"
          echo "Keystore type: ${STORE_TYPE:-unknown}"

          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass:env STORE_PASS -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::KEY_ALIAS was not found in the keystore. Available aliases:"
            printf '%s\n' "$LIST_OUTPUT" | sed -n 's/^Alias name: */  - /p'
            exit 1
          fi

          KEY_PASS="${KEY_PASS_INPUT:-$STORE_PASS}"
          if [ "${STORE_TYPE^^}" = "PKCS12" ] && [ "$KEY_PASS" != "$STORE_PASS" ]; then
            echo "::warning::Keystore is PKCS12, which uses the store password for keys; ignoring KEY_PASSWORD."
            KEY_PASS="$STORE_PASS"
          fi
          export KEY_PASS

          mapfile -t UNSIGNED_APKS < <(find "$RELEASE_DIR" -maxdepth 1 -type f -name "*-unsigned.apk" | sort)
          if [ "${#UNSIGNED_APKS[@]}" -eq 0 ]; then
            echo "::error::No unsigned APK found in $RELEASE_DIR"
            exit 1
          fi

          for apk in "${UNSIGNED_APKS[@]}"; do
            echo "Signing $(basename "$apk")"
            aligned="${apk%.apk}-aligned.apk"
            if "$BUILD_TOOLS/zipalign" -c 4 "$apk" > /dev/null 2>&1; then
              cp "$apk" "$aligned"
            else
              "$BUILD_TOOLS/zipalign" -f -P 16 4 "$apk" "$aligned"
            fi
            signed="${apk%-unsigned.apk}-signed.apk"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE_FILE" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:STORE_PASS \
              --key-pass env:KEY_PASS \
              --out "$signed" \
              "$aligned"
            rm -f "$aligned" "${signed}.idsig"
            "$BUILD_TOOLS/apksigner" verify "$signed"
          done

      - name: Move signed APK
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="${{ steps.release_dir.outputs.release_dir }}"
          mkdir -p "$RELEASE_DIR/out"
          mapfile -t SIGNED_APKS < <(
            find "$RELEASE_DIR" -maxdepth 1 -type f \
              \( -name "*-signed.apk" -o -name "*-unsigned-signed.apk" \) | sort
          )
          if [ "${#SIGNED_APKS[@]}" -ne 1 ]; then
            printf 'Expected one signed APK in %s, found %s\n' "$RELEASE_DIR" "${#SIGNED_APKS[@]}" >&2
            exit 1
          fi
          mv "${SIGNED_APKS[0]}" "$RELEASE_DIR/out/${{ steps.variant.outputs.apk_name }}"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.variant.outputs.apk_name }}
          path: ${{ steps.release_dir.outputs.release_dir }}/out/${{ steps.variant.outputs.apk_name }}
          if-no-files-found: error
